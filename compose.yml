# Local MCP servers that TrueForge connects to over HTTP.
#
# Every service runs with network_mode: host. Containers on this machine's docker
# bridge have no outbound route — not even to the gateway — so a bridged MCP
# server registers fine and then fails every search. Host networking also means
# each server binds its port directly: supergateway has no --host flag, so the
# bridged servers (hn, signal, whatsapp) are reachable from the LAN. They hold no
# credentials of their own, but do not run this on an untrusted network.
services:
  discord-mcp:
    image: saseq/discord-mcp:latest
    container_name: discord-mcp
    restart: unless-stopped
    network_mode: host
    environment:
      # "http" exposes one shared MCP endpoint instead of stdio-per-session.
      SPRING_PROFILES_ACTIVE: http
      # The process exits immediately (System.exit(1)) if this is empty — see
      # the bot-setup steps in .env.example before starting this service.
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
    healthcheck:
      # The image's own documented health check — lets `docker compose ps` and
      # `docker inspect` show real status instead of "running" with a server
      # that exited seconds ago because DISCORD_TOKEN was empty or rejected.
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  reddit-mcp:
    image: ghcr.io/jordanburke/reddit-mcp-server:latest
    container_name: reddit-mcp
    restart: unless-stopped
    network_mode: host
    environment:
      # All four are optional: with none set the server runs anonymous and
      # read-only at ~10 req/min. Client id/secret raise that to 60-100 req/min;
      # username/password are additionally required for the write tools.
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USERNAME: ${REDDIT_USERNAME:-}
      REDDIT_PASSWORD: ${REDDIT_PASSWORD:-}

  hn-mcp:
    # mcp-hn is stdio-only; the image wraps it in supergateway to speak HTTP.
    build:
      context: ./docker
      dockerfile: hn-mcp.Dockerfile
      # Build-time DNS needs the host resolver on this machine.
      network: host
    image: local/hn-mcp:latest
    container_name: hn-mcp
    restart: unless-stopped
    network_mode: host

  linkedin-mcp:
    image: stickerdaniel/linkedin-mcp-server:latest
    container_name: linkedin-mcp
    restart: unless-stopped
    network_mode: host
    volumes:
      # Holds the browser profile and session cookie. This container has no
      # display, so plain --login fails ("no valid session"); use
      # --login-viewer, which serves the login browser at a token-protected
      # URL on :6080 for you to open — it prints the exact URL to visit. Stays
      # open through 2FA/captcha if LinkedIn asks for it. Run once:
      #   docker run -it --rm --network host \
      #     -v ~/.linkedin-mcp:/home/pwuser/.linkedin-mcp \
      #     stickerdaniel/linkedin-mcp-server:latest --login --login-viewer
      # --network host is required here, not just for the long-running service
      # below: the default bridge network has no outbound route on this
      # machine (its FORWARD chain is missing Docker's own rules), so a
      # bridged container's browser can't reach linkedin.com at all and the
      # login times out. With --network host, --login-viewer's port 6080
      # binds straight to the host, so drop the -p flag too.
      # `docker stop linkedin-mcp` first if the service below is already
      # running — both share the host network namespace on --network host, so
      # two containers each starting their own virtual X display collide
      # ("server already running"). Start it back up once login is done.
      - ${HOME}/.linkedin-mcp:/home/pwuser/.linkedin-mcp
    # On the host network it can bind loopback directly, which is what its own
    # docs recommend outside Docker.
    command: ["--transport", "streamable-http", "--host", "127.0.0.1", "--port", "8087", "--path", "/mcp"]

  telegram-mcp:
    # Builds straight from the upstream repo; it has a native HTTP transport.
    build:
      context: https://github.com/chigwell/telegram-mcp.git
      network: host
    image: local/telegram-mcp:latest
    container_name: telegram-mcp
    restart: unless-stopped
    network_mode: host
    environment:
      MCP_TRANSPORT: http
      # From https://my.telegram.org/apps, plus a session string generated with
      # the repo's session_string_generator.py (QR or phone login).
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}

  signal-mcp:
    build:
      context: ./docker
      dockerfile: signal-mcp.Dockerfile
      network: host
    image: local/signal-mcp:latest
    container_name: signal-mcp
    restart: unless-stopped
    network_mode: host
    environment:
      SIGNAL_USER_ID: ${SIGNAL_USER_ID:-}
    volumes:
      # signal-cli's registration lives here. Register once before starting:
      #   docker compose run --rm signal-mcp signal-cli -u +15551234567 register
      #   docker compose run --rm signal-mcp signal-cli -u +15551234567 verify CODE
      - ${HOME}/.local/share/signal-cli:/root/.local/share/signal-cli

  whatsapp-mcp:
    build:
      context: ./docker
      dockerfile: whatsapp-mcp.Dockerfile
      network: host
    image: local/whatsapp-mcp:latest
    container_name: whatsapp-mcp
    restart: unless-stopped
    network_mode: host
    volumes:
      - whatsapp-store:/app/whatsapp-bridge/store

  youtube-mcp:
    build:
      context: ./docker
      dockerfile: youtube-mcp.Dockerfile
      network: host
    image: local/youtube-mcp:latest
    container_name: youtube-mcp
    restart: unless-stopped
    network_mode: host
    environment:
      MCP_PORT: "8091"
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}

  instagram-mcp:
    build:
      context: ./docker
      dockerfile: instagram-mcp.Dockerfile
      network: host
    image: local/instagram-mcp:latest
    container_name: instagram-mcp
    restart: unless-stopped
    network_mode: host
    environment:
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${INSTAGRAM_BUSINESS_ACCOUNT_ID:-}

  tiktok-mcp:
    build:
      context: ./docker
      dockerfile: tiktok-mcp.Dockerfile
      network: host
    image: local/tiktok-mcp:latest
    container_name: tiktok-mcp
    restart: unless-stopped
    network_mode: host
    environment:
      TIKNEURON_MCP_API_KEY: ${TIKNEURON_MCP_API_KEY:-}

  brave-mcp:
    build:
      context: ./docker
      dockerfile: brave-mcp.Dockerfile
      network: host
    image: local/brave-mcp:latest
    container_name: brave-mcp
    restart: unless-stopped
    network_mode: host
    environment:
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}

volumes:
  whatsapp-store:
